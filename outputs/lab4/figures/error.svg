<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="346" viewBox="0 0 1000 346"><rect width="100%" height="100%" fill="#fff"/><text x="30" y="42" font-size="24" font-family="Microsoft YaHei, sans-serif" font-weight="bold">剩余误差案例</text><rect x="20" y="61" width="960" height="44" fill="#eef4fa"/><text x="34" y="88" font-size="18" font-family="Microsoft YaHei, sans-serif">样本</text><text x="370" y="88" font-size="18" font-family="Microsoft YaHei, sans-serif">ZJJ-T01:75</text><rect x="20" y="113" width="960" height="44" fill="#f8fafc"/><text x="34" y="140" font-size="18" font-family="Microsoft YaHei, sans-serif">原文局部</text><text x="370" y="140" font-size="18" font-family="Microsoft YaHei, sans-serif">赴湖南张家界旅游景区游览……饱览了那里奇山异峰</text><rect x="20" y="165" width="960" height="44" fill="#eef4fa"/><text x="34" y="192" font-size="18" font-family="Microsoft YaHei, sans-serif">人工先行词</text><text x="370" y="192" font-size="18" font-family="Microsoft YaHei, sans-serif">张家界</text><rect x="20" y="217" width="960" height="44" fill="#f8fafc"/><text x="34" y="244" font-size="18" font-family="Microsoft YaHei, sans-serif">规则预测</text><text x="370" y="244" font-size="18" font-family="Microsoft YaHei, sans-serif">张家界旅游景区</text><rect x="20" y="269" width="960" height="44" fill="#eef4fa"/><text x="34" y="296" font-size="18" font-family="Microsoft YaHei, sans-serif">原因</text><text x="370" y="296" font-size="18" font-family="Microsoft YaHei, sans-serif">景区名称粒度不一致；按精确字符串计为错误</text></svg>